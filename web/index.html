<html>
    <head>
        <meta charset="utf-8" />
        <title>Linguistique</title>
        <link rel="stylesheet" href="main.css">

    </head>
    <body>

        <div id="step_csv" class="menu">
            <br>
            <h1>Étape 1 - Importer/Nettoyer</h1>
            <button onclick="step_units()">></button>
            
            <br>
            <div id="container">
                <label for="csv_separator">Séparateur de colonnes csv :</label>
                <input type="text" id="csv_separator" type="text" size=2 value=";" />
                <br>
                <label for="csv_import">Importer un csv :</label>
                <input name="csv_import" id="csv_import" type="file"/>
                <br><br>
                Nettoyer les textes (majuscules, ponctuation, etc)
                <br>
                <label for="chars_delete">Caractères à retirer :</label>
                <input type="text" id="chars_delete" type="text" size=20 value=".,;:!?_-[](){}。" />
                <br>
                <button id="uk_str_remove_majs">Retirer les caractères en langue inconnue</button>
                <button id="k_str_remove_majs" class="hidden">Retirer les caractères en langue connue</button>
            </div>
        </div>
        <div id="step_units" class="hidden menu">
            <br>
            <button onclick="step_csv()">&lt;</button>
            <h1>Étape 2 - Extraction des unités</h1>
            <button onclick="step_matching()">></button>
            
            <br>
            <div id="container">
                Nettoyer la langue connue
                <button id="k_english_str_remove_majs">Retirer les caractères spéciaux en langue connue (ponctuation)</button>

                <br>
                Extraction d'unités
                <label for="units_method">Méthode :</label>
                <select name="units_method" id="units_method">
                    <option value="units_words" selected>Mots (séparation par les espaces)</option>
                    <option value="morphemes">Morphèmes (basé sur un dictionnaire)</option>
                </select>
                <br>
                <button id="units_extract">Extraire les unités</button>
            </div>
        </div>
        <div id="step_matching" class="hidden menu">
            <button onclick="step_units()">&lt;</button>
            <h1>Étape 3 - Matching</h1>
        </div>

        <br>

        <table id="strs">
            <thead>
                <th>Texte Langue inconnue</th>
                <th>Texte langue connue</th>
                <th>Unités langue connue</th>
            </thead>
        </table>

        <script id="interface" src="frontend.js"></script>
        
    </body>
</html>
